<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google Sign-In - LoadLine Web Runner</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }
      :root {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
      }
      body {
        margin: 0;
        padding: 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 90vh;
        text-align: center;
      }
      .card {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 12px;
        padding: 32px 24px;
        max-width: 440px;
        width: 100%;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      }
      .btn {
        background-color: #1a73e8;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 6px;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-top: 16px;
        width: 100%;
        transition: background-color 0.2s;
      }
      .btn:hover {
        background-color: #1557b0;
      }
      .spinner {
        display: inline-block;
        width: 24px;
        height: 24px;
        border: 3px solid rgba(147, 197, 253, 0.3);
        border-radius: 50%;
        border-top-color: #93c5fd;
        animation: spin 0.8s linear infinite;
        margin-bottom: 12px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .status {
        color: #94a3b8;
        font-size: 0.9rem;
        margin-top: 8px;
        line-height: 1.4;
      }
      .success {
        color: #4ade80;
        font-size: 0.95rem;
        font-weight: 600;
        margin-top: 12px;
      }
      .error {
        color: #f87171;
        font-size: 0.85rem;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div id="loading-spinner" class="spinner" style="display: none;"></div>
      <h3 style="margin: 0 0 8px 0; font-size: 1.25rem;">Google Authentication</h3>
      <div id="status-text" class="status">Click the button below to authorize LoadLine Web Runner.</div>
      <button id="btn-signin" class="btn">
        <svg width="20" height="20" viewBox="0 0 24 24">
          <path fill="#ffffff" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#ffffff" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#ffffff" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#ffffff" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Sign in with Google</span>
      </button>
      <div id="error-text" class="error" style="display: none;"></div>
      <div style="margin-top: 16px; font-size: 0.8rem; color: #64748b;">
        <a href="/privacy.html" target="_blank" style="color: #94a3b8; text-decoration: underline;">Privacy Policy</a>
      </div>
    </div>

    <script type="module">
      const GIS_SESSION_STORAGE_KEY = 'crossbench_gis_auth_session';
      const params = new URLSearchParams(window.location.search);
      const clientId = params.get('client_id') || '161886483514-ii0p3mlg6na6cbimqs18rqsgc50hj1f7.apps.googleusercontent.com';
      const scope = params.get('scope') || 'https://www.googleapis.com/auth/devstorage.read_only';
      const promptVal = params.get('prompt') || 'consent';
      const hintVal = params.get('hint') || '';

      const statusText = document.getElementById('status-text');
      const errorText = document.getElementById('error-text');
      const spinner = document.getElementById('loading-spinner');
      const btnSignin = document.getElementById('btn-signin');

      let tokenClient = null;
      let authCompleted = false;

      function getBroadcastChannel() {
        try {
          if (typeof BroadcastChannel !== 'undefined') {
            return new BroadcastChannel('crossbench_gis_auth');
          }
        } catch (e) {
          console.warn('Failed to initialize BroadcastChannel:', e);
        }
        return null;
      }

      const lifecycleChannel = getBroadcastChannel();
      if (lifecycleChannel) {
        lifecycleChannel.onmessage = (event) => {
          if (event.data?.type === 'GIS_AUTH_CLOSE_POPUP') {
            authCompleted = true;
            window.close();
          }
        };
      }

      function notifyPopupOpened() {
        try {
          localStorage.setItem('crossbench_gis_auth_broadcast', JSON.stringify({
            type: 'GIS_AUTH_POPUP_OPENED',
            timestamp: Date.now(),
          }));
        } catch (e) {}
        if (lifecycleChannel) {
          try {
            lifecycleChannel.postMessage({ type: 'GIS_AUTH_POPUP_OPENED' });
          } catch (e) {}
        }
      }

      function notifyWindowClosed() {
        if (authCompleted) return;
        try {
          localStorage.setItem('crossbench_gis_auth_broadcast', JSON.stringify({
            type: 'GIS_AUTH_WINDOW_CLOSED',
            timestamp: Date.now(),
          }));
        } catch (e) {}
        if (lifecycleChannel) {
          try {
            lifecycleChannel.postMessage({ type: 'GIS_AUTH_WINDOW_CLOSED' });
            lifecycleChannel.close();
          } catch (e) {}
        }
      }

      notifyPopupOpened();
      window.addEventListener('pagehide', notifyWindowClosed);
      window.addEventListener('beforeunload', notifyWindowClosed);

      function notifySuccess(session) {
        authCompleted = true;
        // 1. Save directly to localStorage for cross-tab sharing
        try {
          localStorage.setItem(GIS_SESSION_STORAGE_KEY, JSON.stringify(session));
          localStorage.setItem('crossbench_gis_auth_broadcast', JSON.stringify({
            type: 'GIS_AUTH_SUCCESS',
            session,
            timestamp: Date.now(),
          }));
        } catch (e) {
          console.warn('Failed to save to localStorage:', e);
        }

        // 2. Broadcast via BroadcastChannel
        const channel = lifecycleChannel || getBroadcastChannel();
        if (channel) {
          try {
            channel.postMessage({ type: 'GIS_AUTH_SUCCESS', session });
            channel.close();
          } catch (e) {}
        }

        if (spinner) spinner.style.display = 'none';
        if (btnSignin) btnSignin.style.display = 'none';
        if (errorText) errorText.style.display = 'none';

        const emailInfo = session.userEmail ? ` (${session.userEmail})` : '';
        statusText.innerHTML = `<span class="success">✅ Authorization successful${emailInfo}!</span><br><span style="color:#94a3b8;font-size:0.85rem;margin-top:6px;display:inline-block;">Closing window...</span>`;

        setTimeout(() => {
          window.close();
        }, 500);
      }

      function showLocalError(msg) {
        if (spinner) spinner.style.display = 'none';
        if (btnSignin) {
          btnSignin.style.display = 'inline-flex';
          btnSignin.disabled = false;
        }
        if (errorText) {
          errorText.innerText = msg;
          errorText.style.display = 'block';
        }
        statusText.innerText = 'Sign-in incomplete. Please click the button below to try again.';
      }

      async function fetchUserEmail(token) {
        if (!token) return undefined;
        try {
          const res = await fetch('https://www.googleapis.com/oauth2/v3/tokeninfo?access_token=' + encodeURIComponent(token));
          if (res.ok) {
            const data = await res.json();
            return data && data.email ? String(data.email) : undefined;
          }
        } catch {}
        return undefined;
      }

      function initGis() {
        if (!window.google?.accounts?.oauth2) {
          setTimeout(initGis, 100);
          return;
        }

        try {
          tokenClient = window.google.accounts.oauth2.initTokenClient({
            client_id: clientId,
            scope: scope,
            callback: async (response) => {
              if (response.error) {
                const msg = response.error_description || response.details || response.error || 'Authorization failed.';
                showLocalError(msg);
                return;
              }

              if (spinner) spinner.style.display = 'inline-block';
              statusText.innerText = 'Validating authentication...';

              const rawExpiresIn = parseInt(String(response.expires_in || '3599'), 10);
              const expiresIn = isNaN(rawExpiresIn) || rawExpiresIn <= 0 ? 3599 : rawExpiresIn;
              const expiresAt = Date.now() + expiresIn * 1000;

              const session = {
                accessToken: response.access_token,
                tokenType: response.token_type || 'Bearer',
                expiresAt,
                scope: response.scope || scope,
              };

              const email = await fetchUserEmail(session.accessToken);
              if (email) session.userEmail = email;

              notifySuccess(session);
            },
            error_callback: (err) => {
              const msg = err?.message || err?.type || (typeof err === 'string' ? err : 'Popup blocked or closed.');
              showLocalError(msg);
            },
          });

          btnSignin.addEventListener('click', () => {
            if (!tokenClient) return;
            if (errorText) errorText.style.display = 'none';
            if (spinner) spinner.style.display = 'inline-block';
            statusText.innerText = 'Connecting to Google Accounts...';
            btnSignin.disabled = true;
            try {
              tokenClient.requestAccessToken({ prompt: promptVal, hint: hintVal });
            } catch (err) {
              showLocalError(err?.message || String(err));
            }
          });

          // Focus button for easy Enter key press
          btnSignin.focus();
        } catch (err) {
          showLocalError(err?.message || String(err));
        }
      }

      if (document.readyState === 'complete' || document.readyState === 'interactive') {
        initGis();
      } else {
        window.addEventListener('DOMContentLoaded', initGis);
      }
    </script>
  </body>
</html>
